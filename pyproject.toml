[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravilens"
version = "0.1.0"
description = "Physics-informed lens modelling for dark-matter substructure classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.10", "scikit-image>=0.22"]
sim = [
  "lenstronomy==1.14.2",
  "pyHalo==1.4.6",
  "colossus",
  "mcfit",
  "astropy>=6",
  "h5py>=3.10",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["gravilens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
